name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  APP: freeai
  CGO_ENABLED: "1"

jobs:
  test:
    name: Test with CGO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            cc: clang
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            runner: macos-15
            cc: clang
            archive: tar.gz
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            cc: gcc
            archive: tar.gz
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            cc: gcc
            archive: tar.gz
          - goos: windows
            goarch: amd64
            runner: windows-2025
            cc: C:/msys64/clang64/bin/clang.exe
            msystem: CLANG64
            toolchain: mingw-w64-clang-x86_64-toolchain
            archive: zip
          - goos: windows
            goarch: arm64
            runner: windows-11-arm
            cc: C:/msys64/clangarm64/bin/clang.exe
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-toolchain
            archive: zip

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Windows C toolchain
        if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.toolchain }}

      - name: Build Unix executable
        if: matrix.goos != 'windows'
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          set -euo pipefail

          extension=""
          if [ "${GOOS}" = "windows" ]; then
            extension=".exe"
          fi

          mkdir -p "bin/${GOOS}-${GOARCH}"
          go build \
            -trimpath \
            -ldflags "-s -w" \
            -o "bin/${GOOS}-${GOARCH}/${APP}${extension}" \
            .

      - name: Build Windows executable
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "bin/${env:GOOS}-${env:GOARCH}" | Out-Null
          go mod download
          $buildOutput = & go build `
            -trimpath `
            -ldflags "-s -w" `
            -o "bin/${env:GOOS}-${env:GOARCH}/${env:APP}.exe" `
            . 2>&1
          $exitCode = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            $message = ($buildOutput | Select-Object -Last 80 | Out-String).Trim()
            $escaped = $message.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error title=Windows CGO build failed::${escaped}"
            exit $exitCode
          }

      - name: Package Unix executable
        if: matrix.goos != 'windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          package_name="${APP}_${RELEASE_TAG}_${GOOS}_${GOARCH}"
          package_dir="dist/${package_name}"
          mkdir -p "${package_dir}"
          cp "bin/${GOOS}-${GOARCH}/${APP}" "${package_dir}/"
          cp config.yaml "${package_dir}/config.example.yaml"
          tar -czf "dist/${package_name}.tar.gz" -C dist "${package_name}"
          rm -rf "${package_dir}"

      - name: Package Windows executable
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          $ErrorActionPreference = "Stop"

          $packageName = "${env:APP}_${env:RELEASE_TAG}_${env:GOOS}_${env:GOARCH}"
          $packageDir = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item "bin/${env:GOOS}-${env:GOARCH}/${env:APP}.exe" $packageDir
          Copy-Item "config.yaml" (Join-Path $packageDir "config.example.yaml")
          Compress-Archive -Path $packageDir -DestinationPath "dist/${packageName}.zip" -Force
          Remove-Item -Recurse -Force $packageDir

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            notes_file="$(mktemp)"
            cat > "${notes_file}" <<'EOF'
          ## FreeAI v1.0.0

          FreeAI 是一个面向 OpenAI 兼容客户端的本地 AI 网关，支持账号池路由、额度管理、上游代理和请求保护。

          ### 本次发布

          - 支持 macOS、Linux、Windows 的 amd64 和 arm64 可执行程序。
          - 发布构建启用 `CGO_ENABLED=1`，并按目标系统使用原生 C 工具链。
          - 网关支持最大并发、请求体大小、故障切换重试和过载排队时间配置。
          - 自动生成 SHA-256 校验文件，所有压缩包均包含示例配置文件。

          ### 使用方式

          1. 下载与你的系统和架构对应的压缩包。
          2. 解压后复制 `config.example.yaml` 为 `config.yaml` 并按需调整。
          3. 启动 `freeai`（Windows 使用 `freeai.exe`）。
          EOF
            gh release create "${RELEASE_TAG}" dist/* \
              --title "${RELEASE_TAG}" \
              --notes-file "${notes_file}"
            rm -f "${notes_file}"
          fi
