system:
  app-name: "FreeAiGo"
  addr: 8787
  db-type: sqlite
  router-prefix: /api
  use-redis: false
jwt:
  issuer: FreeAiGo
  signing-key: "change-me"
  expires-time: 7d
  buffer-time: 1d
local:
  oss-path: ./data/oss
  proxy-oss-path: /oss
sqlite:
  db-name: freeai
  path: ./data/
  log-mode: silent
zap:
  director: logback
  level: info
  prefix: '[FreeAiGo]'
  retention-day: 7
freeai:
  proxy-prefix: /v1
  request-timeout-seconds: 120
  stream-idle-timeout-seconds: 60
  max-retries: 1
  routing-strategy: weighted_round_robin
  quota-refresh-seconds: 180
  cooldown-seconds: 300
  cleanup-log-retention-days: 30
  secret-key-file: ./data/master.key
  log-prompt-content: false
  upstream-proxy-enabled: false
  upstream-proxy-url: ""
  max-request-body-bytes: 8388608
  max-concurrent-requests: 128
  quota-default-reserve-tokens: 8192
  quota-reservation-ttl-seconds: 1800
